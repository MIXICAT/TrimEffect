# TrimEffects configuration
#
# Matching trim specialization: 2-3 matching pieces = configured Level I; 4 = Level II;
# 4 matching Ascended pieces = Level III. Trim material does not matter.
# Mixed patterns on all four trimmed pieces apply Weakness/Slowness penalties.
# Effects only work while the SMP is ACTIVE (see /trimeffect smp ...).

smp:
  # State used the very first time the plugin runs (before data.yml exists):
  # ACTIVE = effects on immediately, INACTIVE = off until /trimeffect smp start
  default-state: INACTIVE
  # Also lift every restriction when /trimeffect smp restart begins a new season.
  clear-restrictions-on-restart: true
  # Show each lifecycle announcement in the subtitle line (main title remains empty).
  announce-title: true

# How often (in ticks) each player's armor is checked. 20 ticks = 1 second.
check-interval-ticks: 20

# How long each applied effect lasts (ticks). Keep it above check-interval-ticks
# so effects never flicker, and short so they vanish quickly after removing armor.
effect-duration-ticks: 60

# Show potion particles and the effect icon in the HUD.
particles: false
icon: true

# Legacy scaling settings retained for compatibility; specialization uses fixed tiers.
amplifier-per-extra-piece: 1
max-amplifier: 2

# Worlds where trim effects are disabled.
disabled-worlds: []

# Pattern -> effect. Keys without a namespace are treated as minecraft:<key>.
# Datapack patterns can be added as "namespace:name".
# effect: vanilla effect key (speed, strength, jump_boost, ...)
# amplifier: base effect amplifier for the pattern (0 = Level I)
# min-pieces: legacy setting retained for config compatibility; specialization starts at 2 pieces
patterns:
  sentry:
    effect: resistance
    amplifier: 0
    min-pieces: 1
  dune:
    effect: speed
    amplifier: 0
    min-pieces: 1
  coast:
    effect: water_breathing
    amplifier: 0
    min-pieces: 1
  wild:
    effect: jump_boost
    amplifier: 0
    min-pieces: 1
  ward:
    effect: absorption
    amplifier: 0
    min-pieces: 1
  eye:
    effect: night_vision
    amplifier: 0
    min-pieces: 1
  vex:
    effect: slow_falling
    amplifier: 0
    min-pieces: 1
  tide:
    effect: dolphins_grace
    amplifier: 0
    min-pieces: 1
  snout:
    effect: fire_resistance
    amplifier: 0
    min-pieces: 1
  rib:
    effect: strength
    amplifier: 0
    min-pieces: 1
  spire:
    effect: luck
    amplifier: 0
    min-pieces: 1
  wayfinder:
    effect: conduit_power
    amplifier: 0
    min-pieces: 1
  shaper:
    effect: haste
    amplifier: 0
    min-pieces: 1
  silence:
    effect: invisibility
    amplifier: 0
    min-pieces: 2
  raiser:
    effect: health_boost
    amplifier: 0
    min-pieces: 1
  host:
    effect: regeneration
    amplifier: 0
    min-pieces: 2
  flow:
    effect: saturation
    amplifier: 0
    min-pieces: 3
  bolt:
    effect: hero_of_the_village
    amplifier: 0
    min-pieces: 1

# MiniMessage formatting. Placeholders: <season> <player> <duration>
messages:
  prefix: "<gold>[TrimEffects]</gold> "
  no-permission: "<red>You don't have permission to do that.</red>"
  player-only: "<red>Only players can use this.</red>"
  player-not-found: "<red>Unknown player: <player></red>"
  reloaded: "<green>Configuration reloaded.</green>"
  smp-started: "<green>Season <season> has started! Armor trim effects are now <bold>enabled</bold>.</green>"
  smp-restarted: "<gold>Season <season> has begun! Armor trim effects are <bold>enabled</bold> for the new season.</gold>"
  smp-ended: "<red>Season <season> has ended. Armor trim effects are now disabled.</red>"
  smp-paused: "<yellow>Season <season> is paused. Armor trim effects are temporarily disabled.</yellow>"
  smp-resumed: "<green>Season <season> has resumed. Armor trim effects are enabled again.</green>"
  smp-already-active: "<red>The SMP is already active (season <season>).</red>"
  smp-not-active: "<red>The SMP isn't active right now.</red>"
  smp-not-paused: "<red>The SMP isn't paused.</red>"
  smp-season-set: "<green>Season number set to <season>.</green>"
  restricted: "<yellow><player> can't use trim effects <duration>.</yellow>"
  unrestricted: "<green><player> can use trim effects again.</green>"
  not-restricted: "<red><player> isn't restricted.</red>"
  you-restricted: "<red>Your armor trim effects have been disabled <duration>.</red>"
  you-unrestricted: "<green>Your armor trim effects have been re-enabled.</green>"
  toggle-off: "<yellow>Your armor trim effects are now <bold>off</bold>.</yellow>"
  toggle-on: "<green>Your armor trim effects are now <bold>on</bold>.</green>"
